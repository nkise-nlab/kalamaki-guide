name: Geocode POIs (one-off helper)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geocode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun run scripts/geocode.ts
