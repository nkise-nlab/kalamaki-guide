name: Generate audio guides

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Regenerate all files (1 = yes)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run generate-audio
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FORCE: ${{ inputs.force }}
      - name: Commit MP3s
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/audio
          git diff --cached --quiet || git commit -m "Generate audio guides via ElevenLabs"
          git push
